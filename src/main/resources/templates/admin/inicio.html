<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Início</title>
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body>

<header class="topbar">
    <div class="marca-topbar">
        <span class="logo-marca">📘</span>
        <div>
            <strong>Trilha do Saber</strong>
            <span>Administrador</span>
        </div>
    </div>

    <nav class="menu-topbar">
        <a th:href="@{/admin/inicio}" class="item-menu ativo"><span>🏠</span> Início</a>
        <a href="#" class="item-menu"><span>🗄️</span> Banco de Questões</a>
        <a href="#" class="item-menu"><span>📋</span> Simulados</a>
        <a href="#" class="item-menu"><span>👥</span> Usuários</a>
        <a href="#" class="item-menu"><span>🛡️</span> Logs de Auditoria</a>
    </nav>

    <div class="perfil-topbar">
        <div class="avatar-usuario">AD</div>
        <div>
            <strong th:text="${usuario.nome}">Admin Sistema</strong>
            <span th:text="${usuario.email}">adm@umc.br</span>
        </div>
        <a th:href="@{/logout}" class="link-sair">Sair</a>
    </div>
</header>

<main class="conteudo">

    <header class="topo-conteudo">
        <h1>Início</h1>
        <p class="subtitulo-pagina">Visão geral da plataforma</p>
    </header>

    <section class="grade-cards">
        <div class="card-estatistica">
            <span class="rotulo-card">Questões cadastradas</span>
            <strong class="numero-card">-</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Coordenadores ativos</span>
            <strong class="numero-card">-</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Professores ativos</span>
            <strong class="numero-card">-</strong>
        </div>
        <div class="card-estatistica">
            <span class="rotulo-card">Alunos ativos</span>
            <strong class="numero-card">-</strong>
        </div>
    </section>

</main>

</body>
</html>
