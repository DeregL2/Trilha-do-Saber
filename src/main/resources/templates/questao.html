<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu html</title>
</head>
<body>

<!-- Mostra o enunciado da questão, vindo do Model -->
<h2 th:text="${questao.enunciado}"> </h2>

<!-- Formulário: ao enviar, dispara um POST em /responder -->
<form action="/responder" method="post">

    <!-- Campo escondido: envia o id da questão junto, sem o usuário digitar -->
    <input type="hidden" name="questaoId" th:value="${questao.id}">

    <input type="text" name="nomeUsuario">

    <ul>
        <!-- Repete este <li> uma vez para cada alternativa da lista -->
        <li th:each="alternativa : ${alternativas} ">

            <!-- Radio button: mesmo name agrupa todos, só um pode ser escolhido; th:value manda o id da alternativa marcada -->
            <input type="radio" name="alternativaId" th:value="${alternativa.id}">

            <!-- Span separado só pro texto, pra não apagar o input ao lado -->
            <span th:text="${alternativa.texto}">alternativas</span>

        </li>
    </ul>

    <!-- Dispara o envio de tudo que está dentro do form -->
    <button type="submit">Enviar</button>

</form>

</body>
</html>
