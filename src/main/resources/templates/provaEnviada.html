<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prova enviada</title>
    <link rel="stylesheet" th:href="@{/css/simulado.css}">
    <link rel="stylesheet" th:href="@{/css/prova-aluno.css}">
</head>
<body>

<main class="conteudo conclusao">

    <div class="cartao-conclusao">
        <div class="selo-ok">
            <svg width="28" height="28" viewBox="0 0 16 16" fill="none">
                <path d="M3.5 8l3.5 3.5 5.5-6" stroke="#22C55E" stroke-width="1.6"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1>Prova enviada</h1>
        <p class="subtitulo" th:text="${simulado.titulo}">Prova</p>

        <p class="resumo-final">
            Você respondeu <strong th:text="${respondidas}">0</strong> de
            <strong th:text="${total}">20</strong> questões.
        </p>

        <p class="resumo-final prova-nota">
            Você acertou <strong th:text="${resultado.acertos}">0</strong> de
            <strong th:text="${resultado.totalQuestoes}">20</strong> questões
            (<strong th:text="${#numbers.formatDecimal(resultado.percentualAcerto, 1, 0)} + '%'">0%</strong>).
        </p>

        <p class="prova-motivo" th:if="${porSaida}">
            A prova foi encerrada porque você saiu da tela da prova.
        </p>

        <p class="horario">
            Enviada em
            <span th:text="${#temporals.format(simulado.dataFim, 'dd/MM/yyyy HH:mm:ss')}">--</span>
        </p>

        <p class="prova-liberacao">
            O gabarito comentado será liberado quando a prova encerrar, às
            <strong th:text="${#temporals.format(simulado.dataLimite, 'HH:mm')}">21:00</strong>.
            <span id="prova-contagem-liberacao" th:attr="data-segundos=${segundosParaLiberar}"></span>
        </p>

        <a th:href="@{/aluno/dashboard}" class="botao-primario bloco">Voltar ao início</a>
    </div>

</main>

<script>
    (function () {
        var elemento = document.getElementById("prova-contagem-liberacao");
        var segundos = Number(elemento.dataset.segundos);
        if (!segundos || segundos <= 0) {
            return;
        }
        setTimeout(function () { window.location.reload(); }, (segundos + 1) * 1000);
    })();
</script>

</body>
</html>
